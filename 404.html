<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صفحه پیدا نشد | نبض‌شهر</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0d0f">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/style.css">
<style>
  .notfound { display: grid; min-height: 100vh; place-items: center; padding: 48px 20px; }
  .notfound-card { max-width: 520px; padding: 40px 32px; border: 1px solid var(--border-strong); border-radius: var(--radius-lg); background: var(--surface); text-align: center; }
  .notfound-code { display: inline-block; margin-bottom: 18px; padding: 4px 11px; border: 1px solid rgba(155, 212, 81, .3); border-radius: 999px; color: var(--accent-strong); background: var(--accent-soft); font-size: .72rem; font-weight: 800; }
  .notfound-card h1 { margin-bottom: 12px; font-size: 1.5rem; }
  .notfound-card p { margin-bottom: 26px; color: var(--text-muted); font-size: .87rem; line-height: 2; }
  .notfound-card .btn { display: inline-flex; }
</style>
</head>
<body>
  <main class="notfound">
    <div class="notfound-card">
      <span class="notfound-code">خطای ۴۰۴</span>
      <h1>این صفحه پیدا نشد</h1>
      <p>نشانی مورد نظر وجود ندارد یا جابه‌جا شده است. می‌توانید به صفحه‌ی اصلی بازگردید و از آنجا ادامه دهید.</p>
      <a class="btn btn-primary" href="/">بازگشت به صفحه اصلی</a>
    </div>
  </main>
</body>
</html>
